[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-erp-backend"
version = "0.1.0"
description = "Modular ERP & Trust Network Platform — Multi-Tenant FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi[all]>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- ORM & Database ---
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "uuid6>=2.0.1",

    # --- Settings & Validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- Security ---
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt==3.2.2",

    # --- Caching & Event Bus ---
    "redis[hiredis]>=5.0.4",
    "aioredis>=2.0.1",

    # --- Background Tasks ---
    "arq>=0.28.0",

    # --- Utilities ---
    "python-slugify>=8.0.4",
    "orjson>=3.10.3",
    "httpx>=0.27.0",           # Async HTTP client for inter-service calls
    "aiosmtplib>=3.0.0",       # Email fallback notification channel (app.core.notifications.email)
    "reportlab>=4.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",

    # --- Observability ---
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
    "faker>=25.2.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --ignore=tests/isolation --ignore=tests/load"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["test_sqlmodel.py"]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "RUF"]
ignore = ["ANN", "E501", "S101", "S105", "RUF001", "B008", "N806", "F841", "E741", "RUF012", "RUF059", "RUF002", "RUF005", "S608", "E701", "E902", "N802"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["^alembic/", "^test_sqlmodel\\.py$", "^fix_.*\\.py$"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
