[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-erp-backend"
version = "0.1.0"
description = "Modular ERP & Trust Network Platform — Multi-Tenant FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi[all]>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- ORM & Database ---
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # --- Settings & Validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- Security ---
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.3",

    # --- Caching & Event Bus ---
    "redis[hiredis]>=5.0.4",
    "aioredis>=2.0.1",

    # --- Background Tasks ---
    "celery[redis]>=5.4.0",
    "flower>=2.0.1",          # Celery monitoring dashboard

    # --- Utilities ---
    "python-slugify>=8.0.4",
    "orjson>=3.10.3",
    "httpx>=0.27.0",           # Async HTTP client for inter-service calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
    "faker>=25.2.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "RUF"]
ignore = ["ANN101", "ANN102", "ANN002", "ANN003"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
